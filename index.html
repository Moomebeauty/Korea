<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>藏龍體育｜商品部庫存系統</title>
<style>
:root{--g:#1f3b34;--g2:#2d5a4e;--gold:#c9a227;--bg:#f4f5f2;--card:#fff;--line:#e3e6e1;--txt:#1d2421;--mut:#6b746f;--red:#c0392b;--ok:#2e8b57;--warn:#d68910}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
.top{position:sticky;top:0;z-index:20}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header .brand{font-weight:700;letter-spacing:1px}
header .brand small{display:block;font-weight:400;font-size:11px;color:#cfe0da;letter-spacing:0}
header .who{margin-left:auto;font-size:12px;text-align:right;line-height:1.6}
header .who button{background:transparent;border:1px solid #6f8f85;color:#fff;border-radius:12px;padding:2px 8px;font-size:12px;margin-left:4px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--g2);padding:6px 8px}
nav button{flex:0 0 auto;background:transparent;border:0;color:#d9e7e2;padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer}
nav button.on{background:var(--gold);color:#1d2421;font-weight:700}
main{padding:12px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:2px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid #cfd5cf;border-radius:8px;background:#fff;width:100%}
.row input,.row select{width:auto}
button.b{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--g);color:#fff;cursor:pointer}
.b.gold{background:var(--gold);color:#1d2421}.b.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}.b.red{background:var(--red)}.b.sm{padding:5px 10px;font-size:13px}.b.big{padding:13px;font-size:17px;width:100%;font-weight:700}
.b:disabled{opacity:.45}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f0f2ee;font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#eef1ec;color:var(--mut);white-space:nowrap}
.tag.red{background:#fbe5e2;color:var(--red)}.tag.ok{background:#e1f2e8;color:var(--ok)}.tag.warn{background:#fdf0dc;color:var(--warn)}.tag.gold{background:#f7efd2;color:#8a6d0b}
.low{color:var(--red);font-weight:700}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pbtn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font:inherit}
.pbtn b{display:block;font-size:14px;margin-bottom:2px}.pbtn .pr{color:var(--g);font-weight:700}.pbtn .st{font-size:12px;color:var(--mut)}
.pbtn.out{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0;flex-wrap:wrap}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.cart-line{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px}
.total{font-size:22px;font-weight:800;color:var(--g)}
.banner{background:#fff6dc;border:1px solid #f0d98a;color:#6b5300;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:760px){.modal-bg{align-items:center}.modal{border-radius:16px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}.two>.card:last-child{position:sticky;top:110px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2421;color:#fff;padding:10px 18px;border-radius:20px;z-index:60;font-size:14px}
.login{max-width:380px;margin:40px auto}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:8px}
.stat div{background:#f6f8f5;border-radius:10px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mut)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.li{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bar{height:8px;background:#e8ebe6;border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gold)}
.ov td,.ov th{text-align:center;padding:5px 3px;font-size:13px}.ov tr.cur td{background:#f7efd2}.ov tr{cursor:pointer}
.help{background:#eef4f1;border-radius:10px;padding:10px 12px;font-size:13px;color:#2d4a42;margin-bottom:10px;line-height:1.6}
.void{opacity:.5;text-decoration:line-through}
td:first-child{white-space:nowrap}td .b{white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 部署設定：上線時把 Apps Script 網址貼在這裡（留空＝試用模式，資料只存在這台裝置） ===== */
const CONFIG = { SCRIPT_URL: '' };

/* ===== 基本工具 ===== */
const TABLES=['venues','staff','categories','products','payments','targets','settings','sales','moves','recon','payouts'];
const NUMK=['price','cost','safety','bonusValue','target','rewardValue','total','qty','amount','order','subtotal','bonus','diff','expectedTotal','actualTotal'];
const BOOLK=['active'];
const JSONK=['items','expected','actual'];
const ROLES={admin:'管理員',manager:'商品部主管',accountant:'會計',staff:'館員'};
const BONUS_TYPES=[['none','不發獎金'],['pct','照銷售額抽 %'],['fixed','每賣 1 件發固定金額']];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(+n||0)).toLocaleString();
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const nowStr=()=>{const d=new Date();return dstr(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const sumObj=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`;
const MEM={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]??null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}

let DB={};TABLES.forEach(t=>DB[t]=[]);
let SESSION=null;try{SESSION=JSON.parse(lsGet('cl_session')||'null')}catch(e){}
const urlApi=new URLSearchParams(location.search).get('api');
if(urlApi)lsSet('cl_api',urlApi);
const API=CONFIG.SCRIPT_URL||lsGet('cl_api')||'';
const MODE=()=>API?'cloud':'demo';
const S={tab:'sell'};
let CART=[];

const byId=(t,id)=>DB[t].find(r=>r.id===id);
const byOrder=(a,b)=>((+a.order||999)-(+b.order||999))||String(a.name||'').localeCompare(String(b.name||''));
const act=t=>DB[t].filter(r=>r.active!==false).sort(byOrder);
const venueName=id=>byId('venues',id)?.name||(id?'（已刪除）':'不限館');
const staffName=id=>byId('staff',id)?.name||'（未知）';
const payName=id=>byId('payments',id)?.name||'（未知）';
const catName=id=>byId('categories',id)?.name||'未分類';
const me=()=>SESSION&&byId('staff',SESSION.id);
function can(k){const r=me()?.role;const P={settings:['admin'],stockOps:['admin','manager'],allRecords:['admin','manager','accountant'],void:['admin','manager'],recon:['admin','accountant'],bonus:['admin','manager'],pickVenue:['admin','manager','accountant']};return (P[k]||[]).includes(r)}

function norm(r){const o={...r};for(const k in o){let v=o[k];
  if(JSONK.includes(k)&&typeof v==='string'){try{v=v?JSON.parse(v):(k==='items'?[]:{})}catch(e){}}
  else if(NUMK.includes(k)&&v!==''&&v!=null)v=Number(v);
  else if(BOOLK.includes(k))v=!(v===false||v==='false'||v==='FALSE');
  o[k]=v}return o}

/* ===== 資料存取（試用：存本機；正式：存 Google 試算表） ===== */
const Store={
  async load(){
    if(MODE()==='cloud'){
      const r=await fetch(API+'?action=all&_='+Date.now());const j=await r.json();
      if(!j.ok)throw new Error(j.error||'讀取失敗');
      TABLES.forEach(t=>DB[t]=(j.data[t]||[]).map(norm));
    }else{
      const s=lsGet('cl_demo');
      if(s){const d=JSON.parse(s);TABLES.forEach(t=>DB[t]=d[t]||[])}else{seed();saveDemo()}
    }
  },
  async batch(ops){
    ops.forEach(o=>{const arr=DB[o.table];const id=o.op==='del'?o.id:o.row.id;const i=arr.findIndex(x=>x.id===id);
      if(o.op==='del'){if(i>=0)arr.splice(i,1)}
      else{const row={...o.row};if(o.table==='staff'&&!row.pin&&i>=0)row.pin=arr[i].pin;if(i>=0)arr[i]={...arr[i],...row};else arr.push(row)}});
    if(MODE()==='demo'){saveDemo();return true}
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'batch',auth:SESSION,ops})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'未知錯誤');return true;
    }catch(e){await alertBox('儲存失敗：'+e.message+'\n已重新載入最新資料，請再試一次');await Store.load();render();return false}
  },
  put(t,row){return this.batch([{op:'put',table:t,row}])},
  del(t,id){return this.batch([{op:'del',table:t,id}])}
};
function saveDemo(){lsSet('cl_demo',JSON.stringify(DB))}

/* ===== 核心邏輯：庫存＝進貨＋調入−調出±盤點−銷售 ===== */
function stockMap(){const m={};const add=(p,v,q)=>{if(!p||!v)return;m[p]=m[p]||{};m[p][v]=(m[p][v]||0)+(+q||0)};
  DB.moves.forEach(x=>{if(x.type==='transfer'){add(x.productId,x.fromVenue,-x.qty);add(x.productId,x.toVenue,x.qty)}else add(x.productId,x.toVenue,x.qty)});
  DB.sales.forEach(s=>{if(s.status==='void')return;(s.items||[]).forEach(i=>add(i.productId,s.venueId,-i.qty))});
  return m}
const stk=(m,p,v)=>(m[p]&&m[p][v])||0;
function sysSet(){const g=k=>{const v=DB.settings.find(s=>s.id===k)?.value;return v===undefined?undefined:String(v)};
  return{companyName:g('companyName')||'藏龍體育',allowPriceEdit:g('allowPriceEdit')!=='false',allowNegative:g('allowNegative')==='true',teamSplit:g('teamSplit')||'equal'}}
function ruleFor(p){if(p.bonusType&&p.bonusType!=='inherit')return{t:p.bonusType,v:+p.bonusValue||0};const c=byId('categories',p.categoryId);return{t:c?.bonusType||'none',v:+(c?.bonusValue)||0}}
function calcLineBonus(p,sub,qty){const r=ruleFor(p);return r.t==='pct'?Math.round(sub*r.v/100):r.t==='fixed'?r.v*qty:0}
const ruleText=(t,v)=>t==='pct'?`抽 ${v}%`:t==='fixed'?`每件 $${v}`:t==='inherit'?'跟分類':'無獎金';
function expectedFor(date,vid){const e={};DB.sales.filter(s=>s.status!=='void'&&s.date===date&&s.venueId===vid).forEach(s=>{e[s.paymentId]=(e[s.paymentId]||0)+(+s.total||0)});return e}
function reconStatus(date,vid){const et=sumObj(expectedFor(date,vid));const rec=byId('recon','R_'+date+'_'+vid);
  if(!rec)return et?'todo':'none';if(+rec.expectedTotal!==et)return'changed';return +rec.diff===0?'ok':'diff'}
function calcBonus(month){
  const sales=DB.sales.filter(s=>s.status!=='void'&&String(s.date||'').startsWith(month));
  const P={},V={};const get=id=>P[id]||(P[id]={sales:0,personal:0,team:0,byVenue:{}});
  sales.forEach(s=>{const p=get(s.staffId);p.sales+=+s.total||0;p.personal+=(s.items||[]).reduce((a,i)=>a+(+i.bonus||0),0);p.byVenue[s.venueId]=(p.byVenue[s.venueId]||0)+(+s.total||0);V[s.venueId]=(V[s.venueId]||0)+(+s.total||0)});
  const split=sysSet().teamSplit;
  const venues=act('venues').map(v=>{const t=DB.targets.find(x=>x.venueId===v.id);const vs=V[v.id]||0;let team=0;
    if(t&&+t.target>0&&vs>=+t.target)team=t.rewardType==='pct'?Math.round((vs-t.target)*t.rewardValue/100):(+t.rewardValue||0);
    if(team>0&&split==='equal'){const mem=act('staff').filter(s=>s.venueId===v.id);const each=mem.length?Math.floor(team/mem.length):0;mem.forEach(s=>get(s.id).team+=each)}
    else if(team>0&&split==='bySales'){Object.values(P).forEach(p=>{const x=p.byVenue[v.id]||0;if(x>0)p.team+=Math.round(team*x/vs)})}
    return{v,sales:vs,target:+t?.target||0,team,t}});
  return{P,venues}}

/* ===== 小視窗 ===== */
function openModal(h){closeModal();const d=document.createElement('div');d.className='modal-bg';d.id='mbg';d.innerHTML=`<div class="modal">${h}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){$('#mbg')?.remove()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function alertBox(m){return new Promise(res=>{openModal(`<div style="white-space:pre-line;line-height:1.7">${esc(m)}</div><div style="margin-top:14px"><button class="b" id="mok">知道了</button></div>`);$('#mok').onclick=()=>{closeModal();res()}})}
function confirmBox(m){return new Promise(res=>{openModal(`<div style="white-space:pre-line;line-height:1.7">${esc(m)}</div><div class="row" style="margin-top:14px"><button class="b" id="mok">確定</button><button class="b ghost" id="mno">取消</button></div>`);$('#mok').onclick=()=>{closeModal();res(true)};$('#mno').onclick=()=>{closeModal();res(false)}})}
function promptBox(title,ph){return new Promise(res=>{openModal(`<h3>${esc(title)}</h3><input id="mpt" placeholder="${esc(ph||'')}"><div class="row" style="margin-top:14px"><button class="b" id="mok">確定</button><button class="b ghost" id="mno">取消</button></div>`);$('#mpt').focus();$('#mok').onclick=()=>{const v=$('#mpt').value;closeModal();res(v)};$('#mno').onclick=()=>{closeModal();res(null)}})}
function download(name,text,type){const blob=new Blob(['﻿'+text],{type:type||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
const toCSV=rows=>rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');

/* ===== 畫面 ===== */
const TABS=[['sell','🧾 銷售',()=>true],['stock','📦 庫存',()=>true],['records','📋 紀錄',()=>true],['recon','💰 對帳',()=>can('recon')],['bonus','🏆 獎金',()=>true],['settings','⚙️ 基本設定',()=>can('settings')]];
function render(){
  const app=$('#app');
  if(!me()){app.innerHTML=vLogin();return}
  const tabs=TABS.filter(t=>t[2]());if(!tabs.find(t=>t[0]===S.tab))S.tab='sell';
  const u=me();
  app.innerHTML=`<div class="top"><header><div class="brand">${esc(sysSet().companyName)}<small>商品部庫存系統</small></div>
    <div class="who">${esc(u.name)}・${ROLES[u.role]||''}${u.venueId?'・'+esc(venueName(u.venueId)):''}<br><button onclick="refresh()">🔄 更新</button><button onclick="logout()">登出</button></div></header>
    <nav>${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav></div>
    <main>${MODE()==='demo'?`<div class="banner">🧪 目前是<b>試用模式</b>：資料只存在這台裝置，可以放心亂點。正式上線後四館會共用同一份資料。</div>`:''}${VIEWS[S.tab]()}</main>`;
  if(S.tab==='sell')renderGrid();
  if(S.tab==='recon')act('venues').forEach(v=>rcCalc(v.id));
}
async function refresh(){try{await Store.load();render();toast('已更新到最新資料')}catch(e){toast('更新失敗：'+e.message)}}
function logout(){SESSION=null;lsSet('cl_session','');CART=[];render()}

/* --- 登入 --- */
function vLogin(){
  if(MODE()==='cloud'&&!DB.staff.length)return `<div class="login card"><h2>🐉 第一次使用</h2><p class="mut">先建立「管理員」帳號（就是你），之後所有設定都從後台做。</p>
    <label class="f">姓名</label><input id="bs-name"><label class="f">登入密碼（4~6 碼數字）</label><input id="bs-pin" type="password" inputmode="numeric">
    <button class="b big" style="margin-top:14px" onclick="bootstrap()">建立管理員</button></div>`;
  const vs=act('venues');const st=act('staff');
  const groups=[['','總部／不限館'],...vs.map(v=>[v.id,v.name])].map(([vid,nm])=>{const list=st.filter(s=>(s.venueId||'')===vid);return list.length?`<optgroup label="${esc(nm)}">${list.map(s=>opt(s.id,s.name+'（'+(ROLES[s.role]||'')+'）')).join('')}</optgroup>`:''}).join('');
  const demoHint=MODE()==='demo'?`<div class="help" style="margin-top:14px">🧪 試用帳號（姓名＋密碼）<br>于蜜（管理員）0000・溫主管 1111・會計示範 2222<br>小林（一館館員）3333・小陳（二館）4444</div>`:'';
  return `<div class="login card"><h2>🐉 ${esc(sysSet().companyName)}<br><span class="mut">商品部庫存系統</span></h2>
    <label class="f">我是</label><select id="lg-id"><option value="">請選擇</option>${groups}</select>
    <label class="f">密碼</label><input id="lg-pin" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="b big" style="margin-top:14px" onclick="doLogin()">登入</button>${demoHint}</div>`}
async function doLogin(){const id=$('#lg-id').value,pin=$('#lg-pin').value.trim();if(!id||!pin)return toast('請選擇姓名並輸入密碼');
  let ok=false;
  if(MODE()==='demo'){ok=String(byId('staff',id)?.pin)===pin}
  else{try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',id,pin})});ok=(await r.json()).ok}catch(e){return toast('連線失敗，請檢查網路')}}
  if(!ok)return toast('密碼不對喔');
  SESSION={id,pin};lsSet('cl_session',JSON.stringify(SESSION));S.tab='sell';CART=[];render()}
async function bootstrap(){const name=$('#bs-name').value.trim(),pin=$('#bs-pin').value.trim();if(!name)return toast('請填姓名');if(!/^\d{4,6}$/.test(pin))return toast('密碼要 4~6 碼數字');
  const row={id:uid('U'),name,role:'admin',venueId:'',pin,active:true,order:1};
  if(await Store.batch([{op:'put',table:'staff',row},{op:'put',table:'settings',row:{id:'companyName',value:'藏龍體育'}}])){SESSION={id:row.id,pin};lsSet('cl_session',JSON.stringify(SESSION));S.tab='settings';render()}}

/* --- 銷售 --- */
function vSell(){
  const vs=act('venues');
  if(!vs.length||!act('products').length)return `<div class="card">還沒有球館或商品，請管理員先到「⚙️ 基本設定」建立。</div>`;
  if(!can('pickVenue'))S.sellVenue=me().venueId||vs[0].id;
  if(!S.sellVenue||!byId('venues',S.sellVenue))S.sellVenue=(me().venueId&&byId('venues',me().venueId))?me().venueId:vs[0].id;
  if(!can('pickVenue')||!S.seller)S.seller=me().id;

async function saveMoves(){

  const days=[...Array(14)].map((_,i)=>dstr(new Date(Date.now()-i*864e5)));

function vReconCard(d,v){
  const exp=expectedFor(d,v.id);const rec=byId('recon','R_'+d+'_'+v.id);const et=sumObj(exp);
  const pids=[...new Set([...act('payments').map(p=>p.id),...Object.keys(exp)])];
  const stt=reconStatus(d,v.id);const TAG={ok:'<span class="tag ok">已核對・相符</span>',diff:'<span class="tag red">已核對・有差額</span>',todo:'<span class="tag warn">未核對</span>',changed:'<span class="tag warn">資料有變動，請重核</span>',none:'<span class="tag">當天沒銷售</span>'}[stt];
  return `<div class="card"><div class="row"><h3 class="grow">${esc(v.name)}</h3>${TAG}</div>

    <label class="f">備註（有差額時必填）</label><input id="rn-${v.id}" value="${esc(rec?.note||'')}" placeholder="例如：找錯錢、轉帳隔天才入帳">
    <div class="row" style="margin-top:10px"><button class="b ghost sm" onclick="rcFill('${v.id}')">一鍵帶入系統金額</button><button class="b sm" onclick="saveRecon('${d}','${v.id}')">儲存核對</button>
    ${rec?`<span class="mut">上次：${esc(staffName(rec.by))} ${esc(rec.time)}</span>`:''}</div></div>`}
function rcFill(vid){$$(`input[data-rc="${vid}"]`).forEach(i=>i.value=i.dataset.exp);rcCalc(vid)}
function rcCalc(vid){let et=0,at=0,any=false;$$(`input[data-rc="${vid}"]`).forEach(i=>{const e=+i.dataset.exp;et+=e;const c=$(`#rd-${vid}-${i.dataset.pid}`);if(i.value===''){c.innerHTML='';return}any=true;const a=+i.value;at+=a;const df=a-e;c.innerHTML=df===0?'<span class="tag ok">相符</span>':`<span class="tag red">${df>0?'+':''}${df.toLocaleString()}</span>`});
  const ta=$('#rta-'+vid),td=$('#rtd-'+vid);if(!ta)return;ta.textContent=any?money(at):'';const df=at-et;td.innerHTML=any?(df===0?'<span class="tag ok">相符</span>':`<span class="tag red">${df>0?'+':''}${df.toLocaleString()}</span>`):''}
async function saveRecon(d,vid){

  const rows=ids.map(sid=>{const p=P[sid]||{sales:0,personal:0,team:0};const tot=p.personal+p.team;const paid=byId('payouts','P_'+m+'_'+sid);

    return {sid,p,tot,html:`<tr><td>${esc(staffName(sid))}<div class="mut">${esc(venueName(byId('staff',sid)?.venueId))}</div></td><td class="n">${money(p.sales)}</td><td class="n">${money(p.personal)}</td><td class="n">${money(p.team)}</td><td class="n"><b>${money(tot)}</b></td><td>${st}</td></tr>`}});
  S._bonusRows=rows;
  const splitTxt={equal:'團隊獎金由該館人員平分',bySales:'團隊獎金依個人在該館的銷售額比例分配',none:'團隊獎金只算到館，不分到個人'}[sys.teamSplit];
  const rules=act('categories').map(c=>`${esc(c.name)}：${ruleText(c.bonusType,c.bonusValue)}`).join('　');
  return `<div class="row" style="margin-bottom:10px"><b>月份</b><input type="month" value="${m}" onchange="S.bMonth=this.value;render()">${mgr?'<button class="b ghost sm" onclick="exportBonus()">⬇️ 匯出 CSV</button>':''}</div>
    <h2>各館業績目標</h2>${vcards}
    <div class="card"><h2>${mgr?'個人獎金':'我的獎金'}</h2><div class="scroll"><table><tr><th>人員</th><th class="n">銷售額</th><th class="n">個人獎金</th><th class="n">團隊獎金</th><th class="n">合計</th><th>發放</th></tr>${rows.map(r=>r.html).join('')}</table></div>
    <div class="help" style="margin-top:10px">怎麼算的？<br>・個人獎金＝每件商品在<b>賣出當下</b>依規則算好（之後改規則不會影響已賣出的）<br>・分類規則：${rules||'尚未設定'}<br>・${splitTxt}<br>・作廢的銷售不列入</div></div>`}
async function markPaid(m,sid,amt){if(!await confirmBox(`確認 ${staffName(sid)} ${m} 的獎金 ${money(amt)} 已經發放？`))return;
  if(await Store.put('payouts',{id:'P_'+m+'_'+sid,month:m,staffId:sid,amount:amt,by:me().id,time:nowStr()})){toast('已標記發放');render()}}
async function unpay(m,sid){if(!await confirmBox('取消這筆發放紀錄？'))return;if(await Store.del('payouts','P_'+m+'_'+sid))render()}
function exportBonus(){const rows=[['月份','人員','所屬館','銷售額','個人獎金','團隊獎金','合計','已發放金額']];
  (S._bonusRows||[]).forEach(r=>rows.push([S.bMonth,staffName(r.sid),venueName(byId('staff',r.sid)?.venueId),r.p.sales,r.p.personal,r.p.team,r.tot,byId('payouts','P_'+S.bMonth+'_'+r.sid)?.amount??'']));
  download(`獎金_${S.bMonth}.csv`,toCSV(rows))}

  targets:{title:'各館業績目標',help:'每館每月一個目標。達標後的團隊獎金可以是固定金額，或「超過目標的部分」抽 %。',fields:[{k:'venueId',l:'球館',t:'venue',req:1},{k:'target',l:'每月業績目標（元）',t:'number',req:1},{k:'rewardType',l:'達標獎勵方式',t:'select',opts:()=>[['fixed','達標發固定獎金'],['pct','超過目標的部分抽 %']]},{k:'rewardValue',l:'獎勵數值',t:'number',hint:'固定填 2000＝$2000；抽 % 填 10＝超過部分的 10%'}]}
};

};
function vSettings(){const sub=S.setSub||'venues';
  const subs=[['venues','球館'],['staff','人員'],['categories','分類＆獎金'],['products','商品'],['payments','付款方式'],['targets','業績目標'],['sys','系統']];
  return `<div class="sub">${subs.map(([k,l])=>`<span class="chip ${sub===k?'on':''}" onclick="S.setSub='${k}';render()">${l}</span>`).join('')}</div>${sub==='sys'?vSys():vTable(sub)}`}
function vTable(t){const sc=SCHEMA[t];const rows=[...DB[t]].sort(byOrder);
  return `<div class="card"><div class="row"><h2 class="grow">${sc.title}</h2><button class="b gold sm" onclick="editRow('${t}')">＋ 新增</button></div><div class="help">${sc.help}</div>
    ${rows.length?rows.map(r=>`<div class="li"><div class="grow">${SUM[t](r)} ${r.active===false?'<span class="tag red">停用</span>':''}</div><button class="b ghost sm" onclick="editRow('${t}','${r.id}')">編輯</button></div>`).join(''):'<div class="mut">還沒有資料，按「新增」開始</div>'}</div>`}
function field(f,r){let v=r[f.k];const id='fd-'+f.k;let inp;
  switch(f.t){
    case 'bool':{const bv=(v===undefined||v==='')?f.def!==false:!(v===false||v==='false');inp=`<select id="${id}">${opt('true','是',String(bv))}${opt('false','否',String(bv))}</select>`;break}
    case 'select':inp=`<select id="${id}">${f.opts().map(([k,l])=>opt(k,l,v??'')).join('')}</select>`;break;
    case 'venue':inp=`<select id="${id}"><option value="">（不限館／總部）</option>${act('venues').map(x=>opt(x.id,x.name,v)).join('')}</select>`;break;
    case 'cat':inp=`<select id="${id}"><option value="">請選擇</option>${act('categories').map(x=>opt(x.id,x.name,v)).join('')}</select>`;break;
    case 'pin':inp=`<input id="${id}" type="password" inputmode="numeric" placeholder="${r.id?'留空＝不修改':''}">`;break;
    case 'number':inp=`<input id="${id}" type="number" value="${esc(v??'')}">`;break;
    default:inp=`<input id="${id}" value="${esc(v??'')}">`}
  return `<label class="f">${f.l}${f.req?' *':''}</label>${inp}${f.hint?`<div class="mut">${f.hint}</div>`:''}`}
function editRow(t,id){const sc=SCHEMA[t];const r=id?byId(t,id):{};
  openModal(`<h2>${id?'編輯':'新增'}${sc.title}</h2>${sc.fields.map(f=>field(f,r)).join('')}
    <div class="row" style="margin-top:16px"><button class="b" onclick="saveRow('${t}','${id||''}')">儲存</button><button class="b ghost" onclick="closeModal()">取消</button>${id?`<button class="b red sm" style="margin-left:auto" onclick="delRow('${t}','${id}')">刪除</button>`:''}</div>`)}
async function saveRow(t,id){const sc=SCHEMA[t];const row={id:id||uid(t.slice(0,2).toUpperCase())};
  for(const f of sc.fields){let v=$('#fd-'+f.k).value.trim();
    if(f.t==='number')v=v===''?'':Number(v);if(f.t==='bool')v=v==='true';
    if(f.req&&v==='')return toast('請填寫「'+f.l+'」');
    if(f.t==='pin'){if(!id&&!v)return toast('新人員要設定密碼');if(v&&!/^\d{4,6}$/.test(v))return toast('密碼要 4~6 碼數字')}
    row[f.k]=v}
  if(t==='staff'&&id===SESSION.id&&(row.role!=='admin'||row.active===false))return alertBox('不能把自己改成非管理員或停用，不然就沒人能進設定了。');
  if(t==='targets'&&DB.targets.some(x=>x.venueId===row.venueId&&x.id!==row.id))return toast('這館已經有目標了，請直接編輯那一筆');
  if(await Store.put(t,row)){if(t==='staff'&&id===SESSION.id&&row.pin){SESSION.pin=row.pin;lsSet('cl_session',JSON.stringify(SESSION))}closeModal();toast('已儲存');render()}}
function usedBy(t,id){
  if(t==='venues')return DB.sales.some(s=>s.venueId===id)||DB.moves.some(m=>m.toVenue===id||m.fromVenue===id)||DB.staff.some(s=>s.venueId===id);
  if(t==='products')return DB.sales.some(s=>(s.items||[]).some(i=>i.productId===id))||DB.moves.some(m=>m.productId===id);
  if(t==='staff')return id===SESSION.id||DB.sales.some(s=>s.staffId===id);
  if(t==='categories')return DB.products.some(p=>p.categoryId===id);
  if(t==='payments')return DB.sales.some(s=>s.paymentId===id);
  return false}
async function delRow(t,id){if(usedBy(t,id))return alertBox('這筆已經被紀錄使用過了，直接刪除會讓舊帳對不起來。\n請改成「停用」就好 👍');
  if(!await confirmBox('確定刪除？'))return;if(await Store.del(t,id)){closeModal();render()}}

/* ===== 試用範例資料 ===== */
function seed(){
  TABLES.forEach(t=>DB[t]=[]);
  ['一館','二館','三館','四館'].forEach((n,i)=>DB.venues.push({id:'V'+(i+1),name:n,order:i+1,active:true}));
  ['現金','LINE Pay','轉帳','刷卡'].forEach((n,i)=>DB.payments.push({id:'P'+(i+1),name:n,order:i+1,active:true}));
  DB.categories=[{id:'C1',name:'羽球',bonusType:'pct',bonusValue:3,order:1,active:true},{id:'C2',name:'球拍',bonusType:'pct',bonusValue:5,order:2,active:true},{id:'C3',name:'配件',bonusType:'fixed',bonusValue:5,order:3,active:true},{id:'C4',name:'飲料',bonusType:'none',bonusValue:0,order:4,active:true}];
  const PR=[['比賽級羽球（一打）','C1',780,520,10],['練習級羽球（一打）','C1',450,300,10],['入門碳纖維球拍','C2',1800,1100,2],['進階碳纖維球拍','C2',3600,2400,2],['握把布','C3',80,35,15],['運動毛巾','C3',250,120,5],['羽球襪','C3',180,80,6],['運動飲料','C4',35,18,24],['礦泉水','C4',20,8,24]];
  PR.forEach(([name,c,price,cost,safety],i)=>DB.products.push({id:'G'+(i+1),sku:'CL'+String(i+1).padStart(3,'0'),name,categoryId:c,price,cost,safety,bonusType:'inherit',bonusValue:'',order:i+1,active:true}));
  DB.staff=[{id:'U0',name:'于蜜',role:'admin',venueId:'',pin:'0000',order:1,active:true},{id:'U1',name:'溫主管',role:'manager',venueId:'',pin:'1111',order:2,active:true},{id:'U2',name:'會計示範',role:'accountant',venueId:'',pin:'2222',order:3,active:true},
    {id:'U3',name:'小林',role:'staff',venueId:'V1',pin:'3333',order:4,active:true},{id:'U4',name:'小陳',role:'staff',venueId:'V2',pin:'4444',order:5,active:true},{id:'U5',name:'小王',role:'staff',venueId:'V3',pin:'5555',order:6,active:true},{id:'U6',name:'小張',role:'staff',venueId:'V4',pin:'6666',order:7,active:true}];
  DB.targets=DB.venues.map((v,i)=>({id:'T'+(i+1),venueId:v.id,target:[30000,50000,30000,45000][i],rewardType:'fixed',rewardValue:1500}));
  DB.settings=[{id:'companyName',value:'藏龍體育'},{id:'allowPriceEdit',value:'true'},{id:'allowNegative',value:'false'},{id:'teamSplit',value:'equal'}];
  const ago=n=>dstr(new Date(Date.now()-n*864e5));
  DB.venues.forEach(v=>DB.products.forEach(p=>DB.moves.push({id:uid('M'),date:ago(12),time:ago(12)+' 10:00',type:'in',productId:p.id,fromVenue:'',toVenue:v.id,qty:(p.categoryId==='C2'?8:30)+Math.floor(Math.random()*20),reason:'期初庫存',note:'範例資料',by:'U1'})));
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  for(let d=9;d>=0;d--)DB.venues.forEach((v,vi)=>{const n=1+Math.floor(Math.random()*4);for(let k=0;k<n;k++){
    const items=[];const cnt=1+Math.floor(Math.random()*2);for(let j=0;j<cnt;j++){const p=rnd(DB.products);if(items.find(i=>i.productId===p.id))continue;const qty=p.categoryId==='C2'?1:1+Math.floor(Math.random()*3);const sub=p.price*qty;items.push({productId:p.id,name:p.name,price:p.price,qty,subtotal:sub,bonus:calcLineBonus(p,sub,qty)})}
    const hh=10+Math.floor(Math.random()*11);
    DB.sales.push({id:uid('S'),date:ago(d),time:ago(d)+' '+pad(hh)+':'+pad(Math.floor(Math.random()*60)),venueId:v.id,staffId:'U'+(3+vi),items,total:items.reduce((a,i)=>a+i.subtotal,0),paymentId:rnd(['P1','P1','P2','P3']),note:'',status:'ok',createdBy:'U'+(3+vi)})}});
  for(let d=9;d>=2;d--)DB.venues.forEach(v=>{const date=ago(d);const exp=expectedFor(date,v.id);const et=sumObj(exp);if(!et)return;const actual={...exp};let note='';
    if(d===4&&v.id==='V2'&&actual.P1){actual.P1-=100;note='範例：現金少 100，可能找錯錢'}
    const at=sumObj(actual);DB.recon.push({id:'R_'+date+'_'+v.id,date,venueId:v.id,expected:exp,actual,expectedTotal:et,actualTotal:at,diff:at-et,note,by:'U2',time:date+' 22:00'})});
}
